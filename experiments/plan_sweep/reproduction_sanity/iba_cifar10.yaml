# Reproduction sanity: IBA (Nguyen et al., NeurIPS 2023)
# Original setup: CIFAR-10, 100 clients, 10/round, 10% malicious
# Published ASR target: ~80%+ with no defense, imperceptible trigger
name: repro_iba_cifar10
dataset: cifar10
model: resnet18
num_clients: 100
num_rounds: 200
clients_per_round: 10
local_epochs: 5
lr: 0.01
weight_decay: 5e-4
batch_size: 64
seed: 0
eval_every: 5
output_dir: results/reproduction_sanity
device: auto
partition: iid

attack:
  attack_type: iba
  num_malicious: 10
  target_label: 0
  poison_fraction: 0.5
  attack_start_round: 50
  attack_end_round: null
  trigger_kwargs:
    base_features: 32
    generator_epochs: 5
    generator_lr: 0.001
    lambda_noise: 0.01
    trigger_sample_size: 512

defense:
  defense_type: none
